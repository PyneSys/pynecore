[build-system]
# Cython compiles the optional native math extension (see setup.py); without it, or
# without a C compiler, the package still builds and runs on its pure-Python math.
requires = ["setuptools>=61.0", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "pynecore" = "src/pynecore" }
packages.find = { where = ["src"] }
include-package-data = true
zip-safe = false  # Critical for import hooks

[tool.setuptools.package-data]
"pynecore" = ["*.pyi", "*.json"]

# The native extension's source ships in the sdist only; a wheel carries the build.
[tool.setuptools.exclude-package-data]
"pynecore.core" = ["_native_math.pyx", "_native_math.c"]

[tool.distutils]
egg_info.egg_base = "build"

[project]
name = "pynesys-pynecore"
version = "6.10.3" # PineVersion.Major.Minor
description = "Python based Pine Script like runtime and API"
authors = [{ name = "PYNESYS LLC", email = "hello@pynesys.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]


#
# Dependencies
#

# No dependencies for core functionality, it has only a minimal CLI functionality
dependencies = []

# With user-friendly CLI
# Typer floor: 0.16 is the first release exposing TyperChoice, needed to build
# plugin-injected CLI options without depending on Click (Typer dropped its own
# Click dependency in 0.26 in favour of a vendored fork).
optional-dependencies.cli = ["typer>=0.16", "rich", "tzdata"]

# All optional dependencies for cli and all built-in providers
optional-dependencies.all = ["typer>=0.16", "rich", "httpx", "ccxt", "pycryptodome", "tzdata"]

#Optional dependencies for development
optional-dependencies.dev = ["pytest", "pytest-spec"]

### Providers

# For all providers to work (CCXT, Capital.com)
optional-dependencies.providers = ["httpx", "ccxt", "pycryptodome"]

# For CCXT provider to work
optional-dependencies.ccxt = ["ccxt"]

# For Capital.com provider to work
optional-dependencies.capitalcom = ["httpx", "pycryptodome"]


#
# Commands
#

scripts.pyne = "pynecore.cli:app"

[project.entry-points."pyne.plugin"]
ccxt = "pynecore.providers.ccxt:CCXTProvider"
replay = "pynecore.providers.replay:ReplayProvider"


#
# URLs
#

[project.urls]
"Homepage" = "https://pynecore.org"
"Repository" = "https://github.com/pynesys/pynecore"
"Documentation" = "https://pynecore.org/docs"
"Issues" = "https://github.com/pynesys/pynecore/issues"

# Social
"X" = "https://x.com/pynesys"
"Discord" = "https://discord.pynesys.io"
"Discussions" = "https://github.com/PyneSys/pynecore/discussions"


#
# Wheels
#

# Platform wheels carry the compiled ``pynecore.core._native_math``. Every one is tested
# against the pure-Python math it replaces, and must actually contain the extension; the
# venue tests pin the pure-Python math itself, which is the same on every platform.
[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-win32 *-manylinux_i686 *-musllinux_i686"
test-requires = ["pytest", "pytest-spec"]
test-command = "pytest -p no:cacheprovider {project}/tests/t01_lib/t04_math/test_016_native_math_matches_python.py"
test-environment = { PYNE_REQUIRE_NATIVE_MATH = "1" }
