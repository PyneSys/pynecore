[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pynecore-dnse"
version = "0.1.0"
description = "DNSE (Vietnam) data provider and broker plugin for PyneCore"
requires-python = ">=3.11"
dependencies = [
    # Runtime deps of the vendored DNSE openapi-sdk (pynecore_dnse/_vendor/dnse).
    # The REST client (DNSEClient) uses stdlib urllib only; these are for the WS
    # TradingClient, which the SDK's package __init__ imports eagerly:
    "msgpack>=1.0",
    "websockets>=12",
    "certifi",
]
# Framework dep for a standalone install: pynesys-pynecore>=6.7. Intentionally
# NOT declared here — this plugin is developed inside the pynecore fork (editable
# install), and declaring it risks pip pulling upstream over the fork. Add when
# packaging for external distribution.

# v2: the DNSE SDK will be vendored from github.com/dnse-tech/openapi-sdk
# (python/dnse, v2.0.0) — the official "sample SDK" that natively drives the
# account-scoped conditional-order endpoints (orderCategory=STOP/OCO) with a
# default `version` header of 2026-07-23. Not pip-installed ("don't trust pip").

# Entry points are disabled until the v2 provider/broker modules land:
# [project.entry-points."pyne.plugin"]
# dnse = "pynecore_dnse.provider:DNSEProvider"
# dnse_broker = "pynecore_dnse.broker:DNSEBroker"

[tool.setuptools.packages.find]
include = ["pynecore_dnse*"]
