# The Pyne Edge profile: what a Pyne Edge script may not contain.

[E0001]
name = "edge_syntax"
severity = "error"
title = "Syntax outside the Edge profile"
message = "{construct} is not allowed in the Pyne Edge profile."
python = "SyntaxError"
explanation = """
The Pyne Edge profile is the subset of Python that is enough for everything a
Pine Script program needs: every Pine script can be written in it. This
construct is outside it; a full `@pyne` script can use it.
"""

[E0002]
name = "edge_python_builtin"
severity = "error"
title = "Python built-in instead of the Pine one"
message = "`{name}` is Python's built-in here, which is not allowed in the Pyne Edge profile. For {meaning}, import it: `from pynecore.lib import {name}`."
python = "SyntaxError"
explanation = """
Without the import, the name means Python's own built-in, not the Pine
function of the same name.
"""

[E0003]
name = "edge_lambda"
severity = "error"
title = "lambda outside a field default"
message = "`lambda` is allowed only as a `field(default_factory=...)` default of a field."
python = "SyntaxError"
explanation = """
The Pyne Edge profile has no function values. The one `lambda` it takes
builds a field's default value.
"""

[E0004]
name = "edge_assert_message"
severity = "error"
title = "assert message that is not a string literal"
message = "An `assert` message must be a string literal in the Pyne Edge profile."
python = "SyntaxError"
explanation = """
The message is fixed text, as Pine's own messages are: the profile has no use
for one built while the script runs.
"""

[E0005]
name = "edge_subscript_assignment"
severity = "error"
title = "Assignment to a subscript"
message = "Assigning to a subscript is not allowed in the Pyne Edge profile; use `array.set()`."
python = "SyntaxError"
explanation = """
An array element is set with `array.set(id, index, value)`.
"""

[E0006]
name = "edge_import"
severity = "error"
title = "Import outside the Edge profile"
message = "{import} is not allowed in the Pyne Edge profile: only the PyneCore API and `lib.*` libraries can be imported."
python = "SyntaxError"
explanation = """
Relative imports, star imports and modules other than the PyneCore API and
the user's `lib.*` libraries are outside the profile.
"""

[E0007]
name = "edge_decorator"
severity = "error"
title = "Decorator outside the Edge profile"
message = "Only `@script.indicator/strategy/library(...)`, `@method` and `@export` can decorate a function in the Pyne Edge profile."
python = "SyntaxError"
explanation = """
Other decorators change a function while the script runs, which nothing in
Pine needs.
"""

[E0008]
name = "edge_class"
severity = "error"
title = "Class outside the Edge profile"
message = "{detail} A class in the Pyne Edge profile is a plain `@udt` or `@dataclass` field list with methods."
python = "SyntaxError"
explanation = """
A class has exactly one `@udt` or `@dataclass` decorator, no base classes or
keywords, and a body of annotated fields and undecorated methods that take
their receiver first.
"""

[E0009]
name = "edge_call"
severity = "error"
title = "Call outside the Edge profile"
message = "`{name}` cannot be called in the Pyne Edge profile: only defined functions, imported names and {builtins} can."
python = "SyntaxError"
explanation = """
A call goes to a function of the script, an imported name, or one of the few
Python built-ins the profile keeps.
"""

[E0010]
name = "edge_attribute_assignment"
severity = "error"
title = "Attribute set on a function or module"
message = "Assigning an attribute on `{root}` is not allowed in the Pyne Edge profile: functions and modules are not objects."
python = "SyntaxError"
explanation = """
Only objects of user-defined types have fields to set.
"""

[E0011]
name = "edge_reserved_name"
severity = "error"
title = "Double-underscore name"
message = "The name `{name}` is not allowed in the Pyne Edge profile: double-underscore names belong to PyneCore's transform."
python = "SyntaxError"
explanation = """
PyneCore's transform names its own functions and variables with double
underscores, and a Pine script has no such names. Rename the identifier.
"""

