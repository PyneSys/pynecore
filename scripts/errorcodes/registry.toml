# The diagnostic codes PyneCore reports: the one source of every code a
# script's run, the rules of Pyne code and the Pyne Edge profile raise.
# PyneComp keeps the compiler's codes in a registry of its own and reads this
# one from its pinned PyneCore, so every code of the Pyne chain is in exactly
# one of the two.
#
# `python3.14 scripts/errorcodes/generate.py` writes the Python module
# (src/pynecore/errorcodes.py), the Rust side (rust/crates/pynecore-codes) and
# one English docs page per code (docs/reference/codes). `--check` fails when a
# generated file is stale.
#
# One table per code. The code is a domain letter and four digits:
#   R runtime, P Pyne code rules, E Pyne Edge profile,
#   I internal error (ours, not the user's; always asks for a bug report).
# PyneComp's registry holds the S, N, T, C, L and V domains and its own I
# codes.
#
#   [R0001]
#   name = "division_by_zero"        # the constant's name in Rust and Python
#   severity = "error"               # error | warning | info
#   title = "Division by zero"
#   message = "Division by zero."
#   since = "6.1.0"                  # the release that introduced it, set
#                                    # when the code is first released
#   explanation = """
#   What it means, why, and how to fix it.
#   """
#   python = "ZeroDivisionError"     # a runtime code: the built-in exception
#                                    # class(es) its exception derives from
#   exception = "..."                # the exception class's name, where the one
#                                    # made of `name` (CamelCase, ending in
#                                    # Error) would be a built-in's
#
# `{name}` is a parameter, `{{` and `}}` are literal braces. A code is never
# reused with another meaning: a code that is no longer reported keeps its
# table and gets `retired = "<release>"`.

# Runtime errors: a run stops with one of these at the bar where
# the condition occurs. The run's output up to that bar is kept.

[R0001]
name = "division_by_zero"
severity = "error"
title = "Division by zero"
message = "Division by zero."
python = "ZeroDivisionError"
explanation = """
A division, `%` or floor division in Pyne code had a divisor of 0. Pine's own
operators answer `na` here; plain Python arithmetic in Pyne code stops the
run, as it does in PyneCore. Guard the divisor, or use the Pine operator.
"""

[R0002]
name = "na_to_integer"
severity = "error"
title = "An na value converted to an integer"
message = "An `na` value cannot be converted to an integer."
python = "ValueError"
explanation = """
A value that is `na` reached a place that needs a whole number: an index, a
size, a count or Python's `int()` / `round()`. Check the value with `na()` or
replace it with `nz()` first.
"""

[R0003]
name = "infinity_to_integer"
severity = "error"
title = "An infinite value converted to an integer"
message = "An infinite value cannot be converted to an integer."
python = "OverflowError"
explanation = """
A value that is positive or negative infinity reached a place that needs a
whole number: an index, a size, a count, a bar coordinate or Python's
`int()` / `round()`. Infinity usually comes from a division by a value close
to 0.
"""

[R0004]
name = "assertion_failed"
severity = "error"
title = "Assertion failed"
message = "Assertion failed. {message}"
python = "AssertionError"
explanation = """
An `assert` statement of the script found its condition false. The text after
it is the assertion's own message.
"""

[R0005]
name = "runtime_error"
severity = "error"
title = "runtime.error()"
message = "{message}"
python = "RuntimeError"
exception = "ScriptRuntimeError"
explanation = """
The script called `runtime.error()`. The message is the script's own.
"""

[R0006]
name = "argument_not_positive"
severity = "error"
title = "Argument must be greater than 0"
message = "`{function}`: `{parameter}` must be greater than 0, but it is {value}."
python = ["AssertionError", "ValueError"]
explanation = """
A built-in got a length, a period or a multiplier of 0 or less. Pine refuses
these values too.
"""

[R0007]
name = "argument_negative"
severity = "error"
title = "Argument must not be negative"
message = "`{function}`: `{parameter}` must not be negative, but it is {value}."
python = "AssertionError"
explanation = """
A built-in got a negative count, size or offset where only 0 or more is
meaningful.
"""

[R0008]
name = "argument_zero"
severity = "error"
title = "Argument must not be 0"
message = "`{function}`: `{parameter}` must not be 0."
python = "ValueError"
explanation = """
A loop or range got a step of 0, which would never reach its end.
"""

[R0009]
name = "percentage_out_of_range"
severity = "error"
title = "Percentage out of range"
message = "`{function}`: `{parameter}` must be between 0 and 100, but it is {value}."
python = "ValueError"
explanation = """
A percentile or rank built-in got a percentage outside 0..100.
"""

[R0010]
name = "index_out_of_range"
severity = "error"
title = "Index out of range"
message = "`{function}`: index {index} is out of range for a size of {size}."
python = ["IndexError", "ValueError"]
explanation = """
An array, matrix or series view was read or written at an index it does not
have. Indexes start at 0; a negative index counts from the end where the
built-in allows it.
"""

[R0011]
name = "empty_collection"
severity = "error"
title = "Empty collection"
message = "`{function}` needs at least one element, but there is none."
python = ["IndexError", "RuntimeError"]
explanation = """
The built-in takes an element out of an array, a list or a matrix, and there
is no element to take. Check the size first.
"""

[R0012]
name = "size_mismatch"
severity = "error"
title = "Sizes do not match"
message = "`{function}`: the sizes do not match ({left} and {right})."
python = ["ValueError", "AssertionError"]
explanation = """
The built-in combines two arrays or matrices whose sizes or dimensions must
agree, and they do not.
"""

[R0013]
name = "matrix_not_square"
severity = "error"
title = "Matrix is not square"
message = "`{function}` needs a square matrix, but it has {rows} rows and {columns} columns."
python = "ValueError"
explanation = """
The inverse, the determinant, the trace, a power and the eigen decomposition
exist only for a matrix with as many rows as columns.
"""

[R0014]
name = "matrix_singular"
severity = "error"
title = "Matrix is singular"
message = "`{function}`: the matrix is singular."
python = "ValueError"
explanation = """
A singular matrix has no inverse. Its determinant is 0.
"""

[R0015]
name = "no_convergence"
severity = "error"
title = "Calculation did not converge"
message = "`{function}` did not converge."
python = "ValueError"
explanation = """
An iterative matrix calculation reached its step limit without a result. The
matrix usually holds extreme or `na` values.
"""

[R0016]
name = "na_object"
severity = "error"
title = "An na object"
message = "`{name}` cannot take an `na` object."
python = "AttributeError"
explanation = """
A field was written, a method called, a length taken or a loop run on an
object, array or matrix that is `na`. Create the object before it is used,
or check it with `na()`.
"""

[R0017]
name = "unbound_variable"
severity = "error"
title = "Variable read before it is assigned"
message = "`{name}` is read before it is assigned on this path."
python = "UnboundLocalError"
explanation = """
On the path the script took, the variable was not assigned before this read.
Give it a value before the `if` or loop that assigns it.
"""

[R0018]
name = "resource_limit"
severity = "error"
title = "Resource limit exceeded"
message = "The run exceeded the limit of {limit} {resource}."
python = "RuntimeError"
explanation = """
The script created more objects, drawings or memory than the runtime allows,
or a regular expression needed too many steps. The limit protects the run
from running out of memory or time. PyneCore takes the limit of
`request.security` contexts from the `PYNESYS_MAX_SECURITY_CONTEXTS`
environment variable.
"""

[R0019]
name = "invalid_timeframe"
severity = "error"
title = "Invalid timeframe"
message = "`{timeframe}` is not a valid timeframe."
python = ["AssertionError", "ValueError"]
explanation = """
A timeframe is a positive multiplier and a unit: `1`, `60`, `1D`, `1W`, `1M`,
`30S`. An empty string, an unknown unit or a multiplier of 0 is not one.
"""

[R0020]
name = "tick_timeframe"
severity = "error"
title = "Tick timeframe"
message = "The tick timeframe `{timeframe}` is not supported here."
python = "ValueError"
explanation = """
A tick timeframe (`1T`) has no fixed length in time, so this built-in cannot
use it.
"""

[R0021]
name = "invalid_session"
severity = "error"
title = "Invalid session"
message = "`{session}` is not a valid session."
python = "ValueError"
explanation = """
A session is one or more `HHMM-HHMM` ranges, optionally followed by `:` and
the days `1` (Sunday) to `7` (Saturday), separated by commas.
"""

[R0022]
name = "invalid_date"
severity = "error"
title = "Invalid date"
message = "`{text}` is not a valid date."
python = "ValueError"
explanation = """
`timestamp()` takes a date in one of its formats, such as `2024-01-31`,
`2024-01-31T09:30:00+00:00` or `31 Jan 2024 09:30 +0000`. The date must
exist: a month has 1..12, a day as many as its month.
"""

[R0023]
name = "invalid_format"
severity = "error"
title = "Invalid format pattern"
message = "`{pattern}` is not a valid format for `{function}`."
python = "ValueError"
explanation = """
The pattern of `str.format()`, `str.format_time()` or a number format has a
placeholder or a letter the built-in does not know, or is cut short.
"""

[R0024]
name = "invalid_regex"
severity = "error"
title = "Invalid regular expression"
message = "`{pattern}` is not a valid regular expression: {reason}."
python = "re.error"
explanation = """
`str.match()` takes a regular expression; this one does not compile.
"""

[R0025]
name = "unknown_timezone"
severity = "error"
title = "Unknown time zone"
message = "`{timezone}` is not a known time zone."
python = "pynecore.core.datetime.TimezoneNotFoundError"
explanation = """
A time zone is an IANA name, such as `America/New_York`, or a UTC offset,
such as `UTC-5` or `GMT+0530`.
"""

[R0026]
name = "security_data_missing"
severity = "error"
title = "No data for request.security"
message = "`request.security` needs the data of {symbol} on the {timeframe} timeframe, and none was given."
python = "ValueError"
explanation = """
A `request.security()` call asks for another symbol or timeframe. The run
reads it from the data handed to it; give the data of this symbol and
timeframe too: `pyne run` takes it with `--security`, a `ScriptRunner` with
its `security_data` parameter (`security_data={'EXCHANGE:SYMBOL': 'path/to/data.ohlcv'}`).
"""

[R0027]
name = "security_timeframe_higher"
severity = "error"
title = "Lower timeframe request of a higher timeframe"
message = "`request.security_lower_tf` cannot request `{timeframe}`, which is higher than the script's `{chart}`."
python = "RuntimeError"
explanation = """
`request.security_lower_tf()` reads the bars inside each bar of the script,
so its timeframe must be lower. Pass `ignore_invalid_timeframe = true` to get
`na` instead of this error.
"""

[R0028]
name = "security_varies_in_loop"
severity = "error"
title = "request.security that varies in a loop"
message = "A `request.security` expression changes between the iterations of a loop."
python = "RuntimeError"
explanation = """
A `request.security()` call inside a loop must request the same expression
on every iteration.
"""

[R0029]
name = "strategy_value_not_finite"
severity = "error"
title = "Strategy value is not finite"
message = "`{function}`: {what} is not a finite number."
python = "ValueError"
explanation = """
A strategy order or setting got `na` or an infinite quantity, price or
offset, where the strategy engine needs a number.
"""

[R0030]
name = "strategy_in_security"
severity = "error"
title = "Strategy read inside request.security"
message = "`{function}` reads the strategy inside `request.security`, which has no strategy."
python = "AttributeError"
explanation = """
The expression of a `request.security()` call is evaluated in the requested
context, where there are no orders and no positions.
"""

[R0031]
name = "line_price_xloc"
severity = "error"
title = "line.get_price on a time-based line"
message = "`line.get_price` needs a line created with `xloc.bar_index`."
python = "RuntimeError"
explanation = """
A line whose x coordinates are times has no bar index to read a price at.
"""

[R0032]
name = "wrong_operand_type"
severity = "error"
title = "Invalid operand"
message = "`{operation}` cannot take {operand}."
python = "TypeError"
explanation = """
An operation of Pyne code got a value of a type it does not take, such as a
function where a number is needed.
"""

[R0033]
name = "float_range"
severity = "error"
title = "Number out of range"
message = "`{function}`: a result is too large for a number."
python = "OverflowError"
explanation = """
An intermediate result of the calculation is beyond the largest number a
float holds.
"""

[R0034]
name = "decimal_invalid"
severity = "error"
title = "Invalid decimal operation"
message = "`{function}`: the decimal calculation has no result ({why})."
python = "decimal.InvalidOperation"
explanation = """
A calculation in decimal arithmetic, such as a sum of volumes or a currency
amount, met infinities of both signs or a value too large to round.
"""

[R0035]
name = "not_available"
severity = "error"
title = "Not available"
message = "`{function}` is not available."
python = "NotImplementedError"
explanation = """
The built-in has no data source in this runtime. With
`ignore_invalid_symbol = true` it answers `na` instead.
"""

[R0036]
name = "script_timeframe"
severity = "error"
title = "Script timeframe does not fit the data"
message = "The script timeframe `{timeframe}` does not fit the data on `{chart}`: {why}."
python = "ValueError"
explanation = """
A script timeframe folds the bars of the data into longer bars. It must be
equal to or higher than the data's timeframe, a whole multiple of it, and
aligned with the data's bars.
"""

[R0037]
name = "invalid_data"
severity = "error"
title = "Invalid data"
message = "`{where}`: the data is invalid: {why}."
python = "ValueError"
explanation = """
A data file, an imported row or a symbol description is inconsistent: two
sources under one key, a symbol description of another symbol, a timestamp
that does not follow the previous one, or prices that are not finite.
"""

[R0038]
name = "invalid_drawing_argument"
severity = "error"
title = "Invalid drawing argument"
message = "`{function}`: `{parameter}` cannot be {value}."
python = "TypeError"
explanation = """
A drawing built-in got a value it does not take, such as a fractional text
formatting flag.
"""

[R0039]
name = "unknown_method_at_run"
severity = "error"
title = "No such method"
message = "A `{type}` has no method `{method}`."
python = "AssertionError"
explanation = """
A method is called on an object whose type has no method of this name: the
module of the type, the calling module and the libraries it imports export
none. A method call on an `na` object of such a type answers the `na` itself.
"""

[R0040]
name = "argument_order"
severity = "error"
title = "Arguments in the wrong order"
message = "`{function}`: `{parameter}` ({value}) must not be less than `{other}` ({bound})."
python = ["ValueError", "AssertionError"]
explanation = """
The call takes a range whose end comes first: the end argument is less than
the start argument. Swap the two, or check how they are calculated.
"""

[R0041]
name = "matrix_holds_na"
severity = "error"
title = "Matrix with na elements"
message = "`{function}` cannot take a matrix that holds `na`."
python = "ValueError"
explanation = """
The calculation is not defined for a matrix with `na` elements. Replace the
`na` elements first, for example with `matrix.fill`, or check the values the
matrix was built from.
"""

[R0042]
name = "invalid_option"
severity = "error"
title = "Invalid run option"
message = "`{option}`: {why}."
python = ["ValueError", "NotImplementedError"]
explanation = """
An option of the run is not usable as given. This is about how the run was
started, not about the script.
"""

[R0043]
name = "na_object_field"
severity = "error"
title = "Field of an na object"
message = "`{name}` is a field of an `na` object."
python = "RuntimeError"
explanation = """
A field was read or written on a user-defined object or a `chart.point` that
is `na`: directly, through a method, nested (`o.inner.v`) or inside `na()`.
Create the object before its fields are used, or check the object itself
with `na()`.
"""

[R0044]
name = "na_object_copy"
severity = "error"
title = "Copy of an na object"
message = "An `na` object cannot be copied."
python = "RuntimeError"
explanation = """
`copy()` was called on a user-defined object or a `chart.point` that is
`na`. A copy reads every field, so the object must exist: create it first,
or check it with `na()` before copying.
"""

[R0045]
name = "syminfo_member_missing"
severity = "error"
title = "Symbol detail not given"
message = "`syminfo.{name}` is not given for this symbol."
python = "AttributeError"
explanation = """
Some symbol details exist only when the data provider supplies them, such as
`syminfo.avg_spread`. The symbol of this run has none, so reading it stops the
run. Add the value to the symbol's description, or do not read it.
"""

[R0046]
name = "data_file_unreadable"
severity = "error"
title = "Unreadable data file"
message = "`{path}` is not a usable OHLCV file: {why}."
python = "ValueError"
explanation = """
The file is not an OHLCV file, it is damaged, or it was written in a format
version this PyneCore cannot read. Download or convert the data again.
"""

[R0047]
name = "script_not_runnable"
severity = "error"
title = "Script cannot run"
message = "`{path}` cannot run: {why}."
python = ["ImportError", "AssertionError"]
explanation = """
A Pyne code file starts with a docstring holding `@pyne`, has a `main`
function decorated with `@script.indicator`, `@script.strategy` or
`@script.library`, and its `main` returns a dict when it returns anything.
"""

[R0048]
name = "file_not_found"
severity = "error"
title = "File not found"
message = "`{path}` does not exist."
python = "FileNotFoundError"
exception = "MissingFileError"
explanation = """
A file the run needs, such as the script, its data or the data's symbol
description, is not where the run looks for it.
"""

[R0049]
name = "provider_unavailable"
severity = "error"
title = "Data provider unavailable"
message = "`{provider}`: {why}."
python = "RuntimeError"
explanation = """
The data provider or broker of a live run cannot serve it: the connection did
not come up in time, the plugin cannot deliver live data, or the exchange
does not meet what the script requires.
"""

[I0004]
name = "internal_error"
severity = "error"
title = "Internal error"
message = "Internal error: {what}."
explanation = """
An error of PyneAOT, not of the script. Please report it with the script and
the data attached.
"""

# The rules of Pyne code: the transform rejects a module that breaks one,
# before the module runs. Each of these is a SyntaxError that points at the
# place in the source.

[P0001]
name = "reserved_name_char"
severity = "error"
title = "Identifier with PyneCore's reserved character"
message = "`{name}` contains `·`, which is reserved for PyneCore's internal names in Pyne code; rename the identifier."
python = "SyntaxError"
explanation = """
PyneCore names the state it adds to a script with a `·` in the name, so no
identifier of Pyne code may hold one. Python folds a few other characters
into `·` (NFKC normalization), so an identifier spelled with them is rejected
too.
"""

[P0002]
name = "pipeline_name"
severity = "error"
title = "Identifier reserved by the transform"
message = "`{name}` is a name PyneCore's transform generates, reserved in Pyne code; rename the identifier."
python = "SyntaxError"
explanation = """
The transform adds functions and variables of its own to every script. An
identifier of the script spelled like one of them would be overwritten by
it, so the name is reserved.
"""

[P0003]
name = "script_decorator_not_on_main"
severity = "error"
title = "Script decorator not on main"
message = "The script decorator belongs on `main`, not on `{function}`."
python = "SyntaxError"
explanation = """
A script has one entry point, the function the runner calls: `main`. The
`@script.indicator`, `@script.strategy` or `@script.library` decorator marks
it, so it stands on `main` and on no other function.
"""

[P0004]
name = "duplicate_script_decorator"
severity = "error"
title = "Second script decorator"
message = "A module has one script decorator, and `main` is defined twice."
python = "SyntaxError"
explanation = """
A module has one entry point. Keep one decorated `main` and remove the other.
"""

[P0005]
name = "na_bool_not_literal"
severity = "error"
title = "na_bool is not a literal"
message = "`na_bool` must be a literal `True` or `False`: the script's bool semantics are fixed before its module body runs."
python = "SyntaxError"
explanation = """
`na_bool` decides how the script's bools are compiled, so PyneCore reads it
from the source before the module runs. Write it as `True` or `False`, not as
a name or an expression.
"""

[P0006]
name = "series_outside_function"
severity = "error"
title = "Series variable outside a function"
message = "A `Series` variable must be declared inside a function."
python = "SyntaxError"
explanation = """
A series keeps its history per call of the function that declares it. At
module level there is no such call, so declare the series inside `main` or
another function.
"""

[P0007]
name = "persistent_outside_function"
severity = "error"
title = "Persistent variable outside a function"
message = "A `Persistent` variable must be declared inside a function."
python = "SyntaxError"
explanation = """
A persistent variable keeps its value from bar to bar per call of the
function that declares it, as Pine's `var` does. Declare it inside `main` or
another function.
"""

[P0008]
name = "stateful_call_at_module_level"
severity = "error"
title = "Stateful call at module level"
message = "A function that keeps state from bar to bar cannot be called at module level."
python = "SyntaxError"
explanation = """
A `ta.*` call, or any function that keeps a series or a persistent, stores
its state per call site and per bar. The module body runs once, not on every
bar, so call it from `main` or a function `main` calls.
"""

[P0009]
name = "input_not_main_default"
severity = "error"
title = "Input outside main's parameters"
message = "`{function}()` is not a `main()` parameter default; inputs must be declared as `main()` parameter defaults: `def main(length=input.int(14, ...))`."
python = "SyntaxError"
explanation = """
PyneCore reads a script's inputs from the defaults of `main`'s parameters, so
that a run can set them before the script starts. An input called anywhere
else cannot be set.
"""

[P0010]
name = "lib_import_alias"
severity = "error"
title = "lib imported under an alias"
message = "`lib` must be imported as itself, not as an alias."
python = "SyntaxError"
explanation = """
The transform recognizes the Pine builtins by the `lib.` prefix. Write
`from pynecore import lib`.
"""

[P0011]
name = "wildcard_import_without_all"
severity = "error"
title = "Wildcard import of a module without __all__"
message = "Cannot use a wildcard import: the module `{module}` has no `__all__` defined."
python = "SyntaxError"
explanation = """
A wildcard import brings in exactly the names of the module's `__all__`.
Without one, import the names you use one by one.
"""

[P0012]
name = "unknown_lib_attribute"
severity = "error"
title = "Unknown lib attribute"
message = "`{module}` has no attribute `{name}`."
python = "SyntaxError"
explanation = """
The name is not part of this module of `pynecore.lib`. Check its spelling.
If it is a new `pynecore.lib` name, the module property registry is stale:
regenerate `module_properties.json` with `scripts/module_property_collector.py`.
"""

[P0013]
name = "module_state_modified"
severity = "error"
title = "Module-level object modified inside a function"
message = "`{name}` {how} inside a function: an object created outside a function cannot be modified inside one."
python = "SyntaxError"
explanation = """
Module-level state is not restored when a bar is re-executed, so a change
made to it on one execution of a bar would stay when the bar runs again.
Declare the value as `Persistent` or `IBPersistent` inside the function
instead.
"""

[P0014]
name = "plot_call_conditional"
severity = "error"
title = "Plot called conditionally"
message = "`{function}()` must be called unconditionally in the direct body of module-level `main`, before any possible early return."
python = "SyntaxError"
explanation = """
A plot is one series of the script's output, and its place in the output is
fixed by its call. A call inside a branch, a loop, another function or after
an early return would leave the series without a value on some bars. Plot
`na` instead where nothing should be drawn.
"""

[P0015]
name = "plot_as_value"
severity = "error"
title = "Plot used as a value"
