# The test vectors of format_arg: a number as an error message shows it.
# PyneCore's format_arg (core/errors.py) and the Rust pynecore_codes::format_arg
# both run every case; codes/generate.py writes them into the crate's tests.

[[case]]
value = 0.0
text = "0"

[[case]]
value = -0.0
text = "0"

[[case]]
value = 1.0
text = "1"

[[case]]
value = 3.0
text = "3"

[[case]]
value = -7.0
text = "-7"

[[case]]
value = 0.5
text = "0.5"

[[case]]
value = -2.5
text = "-2.5"

[[case]]
value = 0.1
text = "0.1"

[[case]]
value = 1.5
text = "1.5"

[[case]]
value = 0.30000000000000004
text = "0.30000000000000004"

[[case]]
value = 0.3333333333333333
text = "0.3333333333333333"

[[case]]
value = 123456.789
text = "123456.789"

[[case]]
value = 1e-7
text = "0.0000001"

[[case]]
value = 1.5e-10
text = "0.00000000015"

[[case]]
value = 5e-324
text = "0."

[[case]]
value = 1e17
text = "100000000000000000"

[[case]]
value = 999999999999999900.0
text = "999999999999999872"

[[case]]
value = 1e18
text = "1000000000000000000"

[[case]]
value = 1e21
