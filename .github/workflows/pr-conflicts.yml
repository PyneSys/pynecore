name: Conflicting pull requests

# Once a day: label and comment on every open PR that no longer merges into main,
# close it when the conflict is still there 7 days after labelling, and drop the
# label from a PR that merges again. A PR labelled `keep-open` is never closed.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: pr-conflicts

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LABEL: merge-conflict
      KEEP_LABEL: keep-open
      GRACE_DAYS: 7
    steps:
      - name: Label, comment and close conflicting PRs
        run: |
          set -euo pipefail
          gh label create "$LABEL" --color B60205 \
            --description "Does not merge into main; closed after $GRACE_DAYS days" 2>/dev/null || true

          now=$(date -u +%s)
          prs=$(gh pr list --state open --base main --limit 200 --json number --jq '.[].number')
          # GitHub computes mergeability lazily, and a push to main resets it: the
          # first pass asks for every PR to start the computation, the second reads it
          for pr in $prs; do
            gh pr view "$pr" --json mergeable > /dev/null
          done
          [[ -n "$prs" ]] && sleep 30
          for pr in $prs; do
            state=$(gh pr view "$pr" --json mergeable --jq .mergeable)
            echo "#$pr: $state"
            # A state still UNKNOWN is retried on the next run
            labels=$(gh pr view "$pr" --json labels --jq '[.labels[].name] | join(",")')
            has_label=false
            [[ ",$labels," == *",$LABEL,"* ]] && has_label=true

            if [[ "$state" == "MERGEABLE" && "$has_label" == true ]]; then
              gh pr edit "$pr" --remove-label "$LABEL"
              echo "#$pr: merges again, label removed"
            elif [[ "$state" == "CONFLICTING" && "$has_label" == false ]]; then
              deadline=$(date -u -d "+$GRACE_DAYS days" +%Y-%m-%d)
              gh pr edit "$pr" --add-label "$LABEL"
              gh pr comment "$pr" --body "This pull request has conflicts with \`main\`. Please rebase it onto the current \`main\` and push. If the conflict is still there on $deadline, the pull request will be closed (see [CONTRIBUTING.md](https://github.com/$GH_REPO/blob/main/CONTRIBUTING.md))."
              echo "#$pr: conflicting, labelled"
            elif [[ "$state" == "CONFLICTING" && ",$labels," != *",$KEEP_LABEL,"* ]]; then
              labelled_at=$(gh api --paginate "repos/$GH_REPO/issues/$pr/events" \
                --jq ".[] | select(.event == \"labeled\" and .label.name == \"$LABEL\") | .created_at" \
                | tail -n 1)
              [[ -z "$labelled_at" ]] && continue
              age_days=$(( (now - $(date -u -d "$labelled_at" +%s)) / 86400 ))
              if (( age_days >= GRACE_DAYS )); then
                gh pr close "$pr" --comment "Closing: this pull request has had conflicts with \`main\` for $GRACE_DAYS days. Rebase it onto the current \`main\`, push, and reopen it."
                echo "#$pr: closed after $age_days days"
              fi
            fi
          done
