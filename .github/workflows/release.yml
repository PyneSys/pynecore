name: Upload Python Package

on:
  release:
    types: [published]
  # A manual run builds and tests every wheel without publishing anything
  workflow_dispatch:

permissions:
  contents: write
  id-token: write  # Required for trusted publishing
  actions: write  # A failed job cancels the run

jobs:
  # Platform wheels with the compiled native extensions. cibuildwheel runs the
  # native-vs-Python bit-identity test inside every wheel it builds (see
  # [tool.cibuildwheel] in pyproject.toml), so a platform whose compiler changes a
  # single last bit fails the release instead of shipping.
  #
  # The wheels of one platform are split over parallel jobs. The first wheel of a
  # job compiles the whole Rust dependency tree (4.5 to 9.5 minutes), the ones after
  # it reuse it (about 2 minutes each), so a job builds two or three wheels: one per job
  # would pay the full compile everywhere. The split stays within the Free plan's 20
  # concurrent jobs (17 here, plus the three other jobs) and 5 concurrent macOS jobs;
  # macos-15-intel compiles slowest, so it runs three jobs. ``build`` is passed to
  # cibuildwheel as CIBW_BUILD, overriding [tool.cibuildwheel] build; together the
  # selectors cover that list exactly.
  build-wheels:
    name: Wheels ${{ matrix.wheels }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, wheels: cp311-cp312-manylinux, build: "cp311-manylinux_* cp312-manylinux_*" }
          - { os: ubuntu-latest, wheels: cp313-cp315-manylinux, build: "cp313-manylinux_* cp314-manylinux_* cp315-manylinux_*" }
          - { os: ubuntu-latest, wheels: cp311-cp312-musllinux, build: "cp311-musllinux_* cp312-musllinux_*" }
          - { os: ubuntu-latest, wheels: cp313-cp315-musllinux, build: "cp313-musllinux_* cp314-musllinux_* cp315-musllinux_*" }
          - { os: ubuntu-24.04-arm, wheels: cp311-cp312-manylinux, build: "cp311-manylinux_* cp312-manylinux_*" }
          - { os: ubuntu-24.04-arm, wheels: cp313-cp315-manylinux, build: "cp313-manylinux_* cp314-manylinux_* cp315-manylinux_*" }
          - { os: ubuntu-24.04-arm, wheels: cp311-cp312-musllinux, build: "cp311-musllinux_* cp312-musllinux_*" }
          - { os: ubuntu-24.04-arm, wheels: cp313-cp315-musllinux, build: "cp313-musllinux_* cp314-musllinux_* cp315-musllinux_*" }
          - { os: windows-latest, wheels: cp311-cp312, build: "cp311-* cp312-*" }
          - { os: windows-latest, wheels: cp313-cp315, build: "cp313-* cp314-* cp315-*" }
          - { os: windows-11-arm, wheels: cp311-cp312, build: "cp311-* cp312-*" }
          - { os: windows-11-arm, wheels: cp313-cp315, build: "cp313-* cp314-* cp315-*" }
          - { os: macos-15-intel, wheels: cp311, build: "cp311-*" }
          - { os: macos-15-intel, wheels: cp312, build: "cp312-*" }
          - { os: macos-15-intel, wheels: cp313-cp315, build: "cp313-* cp314-* cp315-*" }
          - { os: macos-latest, wheels: cp311-cp312, build: "cp311-* cp312-*" }
          - { os: macos-latest, wheels: cp313-cp315, build: "cp313-* cp314-* cp315-*" }

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The native transform (rust/) is a Rust extension; the Linux build
      # containers install their own toolchain (see [tool.cibuildwheel.linux])
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux'

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_BUILD: ${{ matrix.build }}
        with:
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v6
        with:
          name: dist-wheels-${{ matrix.os }}-${{ matrix.wheels }}
          path: ./wheelhouse/*.whl

      # A failure anywhere fails the release, so the other jobs need not run to their end
      - name: Cancel the run
        if: failure()
        shell: bash
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  # The sdist, plus the pure-Python wheel every platform without a matching binary wheel
  # installs (WebAssembly runtimes among them). It runs the Python math only.
  build-pure:
    name: Sdist and pure wheel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build tool
        run: python -m pip install build

      - name: Build sdist
        run: python -m build --sdist

      - name: Build pure wheel
        run: python -m build --wheel
        env:
          PYNE_BUILD_PURE: "1"

      - uses: actions/upload-artifact@v6
        with:
          name: dist-pure
          path: dist/*

      # A failure anywhere fails the release, so the other jobs need not run to their end
      - name: Cancel the run
        if: failure()
        shell: bash
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  # The native transform against the Python pipeline it ports: the Rust tests,
  # the WebAssembly build, and the parity gates over the repository's own sources. The
  # gates run under two interpreters, as the transform follows the running one's
  # ``repr`` and ``ast.unparse``; the wasm gate needs the job's own WebAssembly build.
  native-transform:
    name: Native transform gates on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.15']

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Rust checks
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace -- -D warnings
          cargo test --workspace
          cargo build -p pyne-transform-wasm --target wasm32-unknown-unknown --release

      - name: Install with the native extension
        run: python -m pip install -e ".[dev]"

      - name: Parity gates
        env:
          PYNE_REQUIRE_NATIVE_TRANSFORM: "1"
          PYTHONPATH: rust/tools
        run: |
          python rust/tools/ported.py --check
          python rust/tools/parse_gate.py
          python rust/tools/wasm_gate.py
          PYNE_AST_BACKEND=verify python -m pytest -p no:cacheprovider tests/t00_pynecore/ast

      # A failure anywhere fails the release, so the other jobs need not run to their end
      - name: Cancel the run
        if: failure()
        shell: bash
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: [build-wheels, build-pure, native-transform]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Bump version after release
        run: |
          # More robust version search
          VERSION_LINE=$(grep -m1 "^version\s*=" pyproject.toml)
          if [ -z "$VERSION_LINE" ]; then
            echo "Version line not found in pyproject.toml"
            exit 1
          fi

          # Extracting version between quotes
          VERSION=$(echo "$VERSION_LINE" | sed -E 's/version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')
          echo "Current version: $VERSION"

          # Version components
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          echo "Bumping to: $NEW_VERSION"

          # New version writing, with flexible pattern matching
          sed -i "s/^version\s*=\s*\"[0-9]\+\.[0-9]\+\.[0-9]\+\"/version = \"$NEW_VERSION\"/" pyproject.toml

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "Bump version after release [skip ci]"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
