            X-Generator:
              schema:
                type: string
              example: tyk.io
            X-Tyk-Api-Expires:
              schema:
                type: string
              example: Thu, 02 Jan 3000 15:04:00 UTC
            Date:
              schema:
                type: string
              example: Thu, 16 Apr 2026 06:59:35 GMT
            Content-Length:
              schema:
                type: integer
              example: 116
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  status:
                    type: integer
              example:
                code: OA-003
                message: Thông tin nhập không hợp lệ
                status: 400
        '500':
          description: Lỗi hệ thống
          headers:
            Vary:
              schema:
                type: string
              example: Origin
            X-Generator:
              schema:
                type: string
              example: tyk.io
            X-Tyk-Api-Expires:
              schema:
                type: string
              example: Thu, 02 Jan 3000 15:04:00 UTC
            Date:
              schema:
                type: string
              example: Thu, 16 Apr 2026 07:02:56 GMT
            Content-Length:
              schema:
                type: integer
              example: 116
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  status:
                    type: integer
              example:
                code: OA-009
                message: Lỗi hệ thống
                status: 500
      tags:
        - market-data
      description: Truy vấn thông tin phiên giao dịch hiện tại.
