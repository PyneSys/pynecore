              schema: {}
            X-Tyk-Api-Expires:
              deprecated: false
              schema: {}
          content:
            application/json:
              schema:
                type: object
                description: Danh sách dữ liệu giá khớp dự kiến cùng thông tin phân trang.
                properties:
                  expectedPrices:
                    type: array
                    description: Danh sách dữ liệu giá khớp dự kiến của mã chứng khoán.
                    items:
                      type: object
                      properties:
                        marketId:
                          type: string
                          example: STO
                          description: |-
                            Mã thị trường niêm yết mã chứng khoán
                            - DVX: Phái sinh sàn HNX
                            - HCX: Trái phiếu doanh nghiệp HNX
                            - STO: Cổ phiếu sàn HOSE
                            - STX: Cổ phiếu sàn HNX
                            - UPX: Cổ phiếu sàn Upcom
                        boardId:
                          type: string
                          example: G1
                          description: |-
                            Mã bảng giao dịch
                            - G1: Lô chẵn
                            - G4: Lô lẻ
                            - T1: Thỏa thuận trong giờ (9h - 14h45)
                            - T3: Thỏa thuận sau giờ (14h45 - 15h)
                            - T4: Thỏa thuận lô lẻ trong giờ (9h - 14h45)
                            - T6: Thỏa thuận lô lẻ sau giờ (14h45 - 15h)
                        isin:
                          type: string
                          example: VN000000HPG4
                          description: Mã định danh quốc tế (ISIN) của chứng khoán.
                        symbol:
                          type: string
                          example: HPG
                          description: Mã chứng khoán
                        closePrice:
                          type: number
                          format: double
                          example: 0
                          description: Giá đóng cửa
                        expectedTradePrice:
                          type: number
                          format: double
                          example: 94.1
                          description: Giá khớp dự kiến
                        expectedTradeQuantity:
                          type: integer
                          format: int32
                          example: 2000
                          description: Khối lượng khớp dự kiến
                        time:
                          type: string
                          example: '2026-08-03 14:40:05.148'
                          description: >-
                            Thời gian ghi nhận. Định dạng: YYYY-MM-DD
                            HH:mm:ss.SSS (GMT+7).
                  nextPageToken:
                    type: string
                    example: null
                    description: >-
                      Token dùng để lấy trang dữ liệu tiếp theo. Giá trị null
                      nếu không còn dữ liệu.
                    nullable: true
        '400':
          description: Yêu cầu không hợp lệ
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                    description: Mã HTTP
                    format: int32
                  code:
                    type: string
                    example: OA-003
                    description: Mã lỗi
                  message:
                    type: string
                    example: Thông tin nhập không hợp lệ
                    description: Thông điệp lỗi
