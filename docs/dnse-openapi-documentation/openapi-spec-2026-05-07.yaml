  /brokers/accounts/care-by:
    get:
      summary: Danh sách tiểu khoản quản lý
      parameters:
        - name: X-API-Key
          in: header
          required: true
          description: API Key được cấp khi đăng ký dịch vụ
          deprecated: false
          schema:
            type: string
          example: '{{apiKey}}'
        - name: X-Aux-Date
          in: header
          required: true
          description: Chữ ký xác thực yêu cầu
          deprecated: false
          schema:
            type: string
          example: '{{date}}'
        - name: X-Signature
          in: header
          required: true
          description: Thời gian thực hiện yêu cầu
          deprecated: false
          schema:
            type: string
          example: '{{signature}}'
        - name: version
          in: header
          description: 'Phiên bản API '
          schema:
            type: string
            format: date
          example: '2026-05-07'
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-cache, no-store, max-age=0, must-revalidate
            Content-Length:
              schema:
                type: integer
              example: 556
            Date:
              schema:
                type: string
              example: Thu, 16 Apr 2026 07:28:50 GMT
            Expires:
              schema:
                type: integer
              example: 0
            Pragma:
              schema:
                type: string
              example: no-cache
            Vary:
              schema:
                type: string
              example: Access-Control-Request-Headers
            X-Content-Type-Options:
              schema:
                type: string
              example: nosniff
            X-Ratelimit-Limit:
              schema:
                type: integer
              example: 1000
            X-Ratelimit-Remaining:
              schema:
                type: integer
              example: 997
            X-Ratelimit-Reset:
              schema:
                type: integer
              example: 1776398276
            X-Tyk-Api-Expires:
              schema:
                type: string
              example: Thu, 02 Jan 3000 15:04:00 UTC
            X-Xss-Protection:
              schema:
                type: integer
              example: 0
          content:
            application/json:
              schema:
                type: object
                properties:
                  careBy:
                    type: array
                    example:
                      - accountNo: '0335000633'
                        fullName: Hoang Tu Mai
                        investorId: '1000009250'
                        custodyCode: 064C1MAI20
                        underlyingNav: 21345678901
                        derivativeNav: 32789123456
                        totalNav: 54134802357
                        dealAccount: true
                        derivativeAccount: true
                        derivative:
                          status: ACTIVE
                        permissions:
                          - product: UNDERLYING_STOCK
                            role: BROKER
                          - product: DERIVATIVES_STOCK
                            role: BROKER
                    items:
                      type: object
                      properties:
                        accountNo:
                          type: string
                          example: '0335000633'
                          description: Số tiểu khoản khách hàng
                        fullName:
                          type: string
                          example: Hoang Tu Mai
                          description: Họ tên khách hàng
                        investorId:
                          type: string
                          example: '1000009250'
                          description: Mã định danh khách hàng tại DNSE
                        custodyCode:
                          type: string
                          example: 064C1MAI20
                          description: Số lưu ký tài khoản khách hàng
                        underlyingNav:
                          type: integer
                          format: int32
                          example: 21345678901
                          description: Tài sản ròng cơ sở
                        derivativeNav:
                          type: integer
                          format: int64
                          example: 32789123456
                          description: Tài sản ròng phái sinh
                        totalNav:
                          type: integer
                          format: int64
                          example: 54134802357
                          description: Tổng tài sản tiểu khoản
                        dealAccount:
                          type: boolean
                          example: true
                          description: Tiểu khoản theo Deal hoặc không
                        derivativeAccount:
                          type: boolean
                          example: true
                          description: Tiểu khoản có tài khoản phái sinh hoặc không
                        derivative:
                          type: object
                          properties:
                            status:
                              type: string
                              example: ACTIVE
                              description: |-
                                Trạng thái tài khoản phái sinh
                                - ACTIVE: Đang hoạt động
                                - INACTIVE: Ngừng hoạt động
                          example:
                            status: ACTIVE
                          description: Thông tin tài khoản phái sinh
                        permissions:
                          type: array
                          example:
                            - product: UNDERLYING_STOCK
                              role: BROKER
                          items:
                            type: object
                            properties:
                              product:
                                type: string
                                example: UNDERLYING_STOCK
                                description: |-
                                  Sản phẩm áp dụng:
                                  - UNDERLYING_STOCK: Cơ sở
                                  - DERIVATIVES_STOCK: Phái sinh
                              role:
                                type: string
                                example: BROKER
                                description: |-
                                  Vai trò trên sản phẩm:
                                  - ADVISOR: Theo dõi
                                  - BROKER: Giao dịch
                          description: Phạm vi quyền quản lý
                    description: Danh sách các tài khoản khách hàng thuộc phạm vi quản lý
                  total:
                    type: integer
                    format: int32
                    example: 2
                    description: Tổng số bản ghi
